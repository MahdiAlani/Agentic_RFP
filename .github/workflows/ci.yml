name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go API (vet + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  workers:
    name: Python workers (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: API end-to-end (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure env
        run: |
          cp .env.example .env
          sed -i 's/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret/' .env

      - name: Start infra
        run: |
          docker compose up -d postgres redis minio
          for i in $(seq 1 60); do
            docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1 \
              && curl -sf localhost:9000/minio/health/live >/dev/null && break
            sleep 2
          done

      - name: Apply migrations
        run: |
          for f in migrations/*.up.sql; do
            docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d app < "$f"
          done

      - name: Start API
        working-directory: backend
        run: |
          go build -o /tmp/api ./cmd/api
          nohup /tmp/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:8080/auth/me && break; sleep 1; done

      # Workers and the LLM pipeline (tests/e2e/test_pipeline.py) are skipped
      # here: they need a paid OPENAI_API_KEY. Run them locally with RUN_LLM_E2E=1.
      - name: Run e2e tests
        env:
          E2E_REQUIRED: "1"
        run: |
          pip install pytest
          pytest tests/e2e -q -rxs

      - name: API log
        if: failure()
        run: cat /tmp/api.log
