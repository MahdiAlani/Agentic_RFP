name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go API (vet + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  workers:
    name: Python workers (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: workers/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end (full Docker stack)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Builds every image and runs migrations, exactly as `docker compose up` does locally.
      - name: Start stack
        env:
          JWT_SECRET: ci-only-secret
        run: |
          cp .env.example .env   # local-dev credentials; compose requires them
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8080/readyz && break; sleep 2; done

      # The LLM pipeline (tests/e2e/test_pipeline.py) is skipped here: it needs
      # a paid OPENAI_API_KEY. Run it locally with RUN_LLM_E2E=1.
      - name: Run e2e tests
        env:
          E2E_REQUIRED: "1"
        run: |
          pip install pytest
          pytest tests/e2e -q -rxs

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color migrate api workers
