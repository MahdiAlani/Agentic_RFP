# Full stack:   docker compose up --build        -> http://localhost:5173
# Infra only:   docker compose up -d postgres redis minio   (see start.ps1)
#
# Credentials come only from the repo-root .env (copy .env.example to start);
# nothing secret is written in this file.

# Connection settings shared by the API and the workers. Hostnames are the
# service names on the compose network, not localhost.
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
  POSTGRES_DB: ${POSTGRES_DB:-app}
  REDIS_ADDR: redis:6379
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env (see .env.example)}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env (see .env.example)}
  MINIO_BUCKET: ${MINIO_BUCKET:-rfp-documents}
  MINIO_USE_SSL: "false"

# Tools reach the API by service name. Presigned upload URLs are signed for
# localhost:9000 (the browser's view), so tools dial minio:9000 instead.
x-tool-env: &tool-env
  API_URL: http://api:8080
  DEMO_DIR: /demo
  STORAGE_INTERNAL_URL: http://minio:9000
  DEMO_EMAIL: ${DEMO_EMAIL:-demo@corvane.example}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-}

x-tool: &tool
  build: ./workers
  profiles: ["tools"]
  environment: *tool-env
  volumes:
    - ./demo:/demo:ro
  depends_on:
    - api
    - workers

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # MinIO no longer publishes images to Docker Hub or quay.io; Chainguard
    # builds the same server from source. It defaults to a non-root user that
    # can't write the data volume, so run as root like the old image did.
    image: cgr.dev/chainguard/minio:latest
    user: root
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env (see .env.example)}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env (see .env.example)}
      # Allow browser (cross-origin) presigned PUT/GET uploads in dev.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # No healthcheck: the image has no shell or curl. Probe
    # http://localhost:9000/minio/health/live from the host instead.

  # Applies migrations/ and exits. Re-running is a no-op once up to date.
  # Other commands: docker compose run --rm migrate version | down 1 | force N
  migrate:
    image: migrate/migrate:v4.18.3
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable
    command: ["up"]
    environment:
      # Read by the Postgres driver, so the password never appears in the URL.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      # Presigned upload/download URLs are opened by the browser, so they must
      # be signed for the host the browser sees.
      MINIO_PUBLIC_ENDPOINT: localhost:9000
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  workers:
    build: ./workers
    restart: unless-stopped
    environment:
      <<: *app-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-off tools that drive the API with the demo data (demo/):
  #   docker compose run --rm seed    load the Corvane demo
  #   docker compose run --rm eval    run the answer-quality eval
  seed:
    <<: *tool
    command: ["python", "seed.py"]

  eval:
    <<: *tool
    command: ["python", "-m", "eval.run"]
    environment:
      <<: *tool-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-gpt-4o}

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
