server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. Resolving per request (via the variable below)
    # means restarting or rebuilding the api container doesn't leave nginx
    # proxying to its old IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Same contract as the Vite dev proxy: /api/* -> backend, prefix stripped.
    location /api/ {
        set $api http://api:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Client-side routing: unknown paths serve the app shell.
    location / {
        try_files $uri /index.html;
    }
}
